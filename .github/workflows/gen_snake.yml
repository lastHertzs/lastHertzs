# 工作流名称，会显示在 Actions 页面左侧
name: Generate Snake

on:
  # 当 main 分支有 push 时触发
  push:
    branches:
      - main
  # 可以在 Actions 页面手动点击 Run workflow 触发
  workflow_dispatch:
  # 每天凌晨 0 点自动运行一次
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    # 指定运行环境，这里用 GitHub 提供的 Ubuntu 最新版本
    runs-on: ubuntu-latest
    steps:
      # 第一步：检出仓库代码
      - name: Checkout
        uses: actions/checkout@v3

      # 第二步：生成贪吃蛇动画
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # 你的 GitHub 用户名
          github_user_name: lastHertzs
          # 输出目录，Action 会在 dist/ 下生成 snake.svg
          outputs: dist

      # 第三步：推送生成的文件到 output 分支
      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v2
        with:
          # 指定目标分支，生成的文件会存放在 output 分支
          target_branch: output
          # 要推送的目录，这里是 dist/
          build_dir: dist
        env:
          # GitHub 提供的默认 Token，用来授权推送
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
